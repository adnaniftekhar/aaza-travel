name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # Manual redeploy only. Do not also listen for workflow_run on the
  # Instagram/Blog jobs: those already push to main, which triggers this
  # workflow via push. Extra workflow_run deploys double the queue and
  # previously left a stuck "waiting" run blocking all later deploys.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Newest deploy wins. cancel-in-progress:false previously queued every
  # Instagram/blog push behind a 4-day stuck environment wait, then cancelled.
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
