name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # Bot commits from Update Instagram / Update Blog use GITHUB_TOKEN, which
  # does NOT trigger this workflow via `push`. Those jobs explicitly dispatch
  # us instead. This schedule is a safety net if a dispatch is skipped.
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Newest deploy wins. cancel-in-progress:false previously queued every
  # Instagram/blog push behind a 4-day stuck environment wait, then cancelled.
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
