name: Update Instagram Feed

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN_ADNAN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_ADNAN }}
          INSTAGRAM_ACCESS_TOKEN_AMY: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_AMY }}
          INSTAGRAM_USER_ID_ADNAN: ${{ secrets.INSTAGRAM_USER_ID_ADNAN }}
          INSTAGRAM_USER_ID_AMY: ${{ secrets.INSTAGRAM_USER_ID_AMY }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: node scripts/fetch-instagram.mjs

      - name: Fetch blog posts
        env:
          BLOGGER_URL: ${{ vars.BLOGGER_URL }}
        run: node scripts/fetch-blog.mjs

      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/feed.json js/feed-archive.json js/blog.json photos/feed/
          if git diff --staged --quiet; then
            echo "No changes to feed.json"
          else
            git commit -m "Update Instagram feed"
            # Retry rebase+push: other bots/pushes can land between pull and push.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              echo "Push rejected (attempt $i); retrying..."
              sleep $((i * 2))
            done
            echo "Failed to push feed update after retries"
            exit 1
          fi

      # GITHUB_TOKEN pushes do not start other workflows. Always dispatch
      # Pages deploy so aazaadventures.com actually updates.
      - name: Deploy site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run "Deploy site to GitHub Pages" --ref main; then
              exit 0
            fi
            echo "Deploy dispatch failed (attempt $i); retrying..."
            sleep $((i * 3))
          done
          echo "Could not start Pages deploy after retries; the scheduled deploy will pick it up."
          exit 0
